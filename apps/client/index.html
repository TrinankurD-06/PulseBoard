<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a09" />
    <meta name="description" content="PulseBoard: uptime monitoring and public status pages." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500;600&display=swap"
    />
    <title>PulseBoard</title>
    <script>
      // Sets the theme before first paint so there is no flash. Keep in step with src/lib/theme.js.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('pulseboard-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        if (theme === 'light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fbf3e8');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
