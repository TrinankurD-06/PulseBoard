# Render Blueprint: API (web service), worker (background worker) and the
# demo-target (web service, for live demos). The client is deployed to Vercel
# (see apps/client/vercel.json). MongoDB is MongoDB Atlas.
#
# After the first deploy, fill in the "sync: false" values in the Render
# dashboard (Atlas connection string, client URL, alert settings).
services:
  - type: web
    name: pulseboard-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start -w @pulseboard/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Atlas SRV string; Atlas clusters are replica sets, so change streams work
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://pulseboard.vercel.app
      - key: DASHBOARD_URL
        sync: false # same as CLIENT_ORIGIN; used for links in alerts
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 'true' # behind Render's proxy: rate limits must see the real client IP
      - key: DEMO_MODE
        value: 'true'
      - key: ALLOW_PRIVATE_TARGETS
        value: 'false'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false

  - type: worker
    name: pulseboard-worker
    runtime: node
    plan: starter # background workers have no free plan on Render
    buildCommand: npm ci
    startCommand: npm start -w @pulseboard/worker
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: DEMO_MODE
        value: 'true'
      - key: ALLOW_PRIVATE_TARGETS
        value: 'false'
      - key: AGENDA_MAX_CONCURRENCY
        value: 20
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false

  # The demo target is a separate public site so the deployed worker can reach
  # it without ALLOW_PRIVATE_TARGETS. Free plan is fine (it sleeps when idle;
  # open its /admin page a minute before a demo to wake it up).
  - type: web
    name: pulseboard-demo-target
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start -w @pulseboard/demo-target
    healthCheckPath: /admin/mode
    envVars:
      - key: NODE_VERSION
        value: 22
