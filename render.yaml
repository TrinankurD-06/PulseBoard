# Render Blueprint: one free web service. RUN_MODE=combined makes the API process
# also run the worker (checks, heartbeats, alerts, rollups), so no separate
# background worker is needed (Render has no free plan for those). The client is
# deployed to Vercel (see apps/client/vercel.json). MongoDB is MongoDB Atlas.
#
# Free web services spin down after about 15 minutes without HTTP traffic, and
# no checks run while the service is asleep. Keep it awake by pinging /health
# every 10 minutes from an external scheduler (cron-job.org, UptimeRobot...),
# or switch `plan` to starter. See docs/DECISIONS.md (D96).
#
# After the first deploy, fill in the "sync: false" values in the Render
# dashboard (Atlas connection string, client URL, alert settings).
services:
  - type: web
    name: pulseboard-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start -w @pulseboard/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: RUN_MODE
        value: combined # API + worker in one process
      - key: AGENDA_MAX_CONCURRENCY
        value: 5 # checks at once; the free plan has 512 MB of memory
      - key: MONGODB_URI
        sync: false # Atlas SRV string; Atlas clusters are replica sets, so change streams work
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://pulseboard.vercel.app
      - key: DASHBOARD_URL
        sync: false # same as CLIENT_ORIGIN; used for links in alerts
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 'true' # behind Render's proxy: rate limits must see the real client IP
      - key: DEMO_MODE
        value: 'true'
      - key: ALLOW_PRIVATE_TARGETS
        value: 'false'
      - key: DEMO_READ_ONLY
        value: 'true' # the demo user is a read-only Viewer; the worker resets the demo data daily
      - key: ADMIN_EMAIL
        sync: false # the administrator's email (enables the admin panel together with the password)
      - key: ADMIN_PASSWORD
        sync: false # at least 8 characters; set it in Render (the README lists the temporary evaluation values)
      - key: DEMO_OWNER_EMAIL
        sync: false # optional: the account that owns the demo workspace (default: a login-less owner)
      - key: BREVO_API_KEY
        sync: false # email alerts through Brevo (HTTPS; the free plan blocks outbound SMTP); wins over Resend
      - key: RESEND_API_KEY
        sync: false # alternative: Resend (sends to any address only once a domain is verified)
      - key: ALERT_FROM_EMAIL
        sync: false # with Brevo: a sender address verified in Brevo, e.g. PulseBoard <you@gmail.com>
      # Optional "Sign in with Google/GitHub": leave empty to hide a provider.
      # Callback: https://<your-vercel-app>/api/v1/auth/oauth/<google|github>/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
